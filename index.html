<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard Tool Day 2</title>
</head>
<body style="background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center;">

    <!-- WADAH UTAMA (FRAME) -->
    <div style="background-color: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 350px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        
        <h2 style="color: #00a2ff;">Roblox Utility Tool</h2>
        <p style="color: #aaa; font-size: 14px;">Tampilan UI versi Dark Mode</p>

        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_2017.svg" width="70" alt="Logo Roblox">

        <br><br>

        <label style="font-size: 13px; color: #ddd;">Cookie / Place ID:</label><br>
        <input type="text" placeholder="Paste data di sini..." style="padding: 10px; width: 85%; margin-top: 5px; border-radius: 6px; border: 1px solid #444; background-color: #2b2b2b; color: white;">

        <br><br>

        <button style="background-color: #ff4757; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; width: 90%;">
            Start Process
        </button>

    </div>

    <p style="font-size: 12px; color: #888;">
        Kunjungi panutan: 
        <a href="https://axolotleless.github.io/ezpublish/" target="_blank" style="color: #00a2ff;">EZ Publish</a>
    </p>

</body>
</html>
